name: CI/CD Pipeline & Automated Deployment

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND_NAME: ${{ github.repository }}-backend
  IMAGE_FRONTEND_NAME: ${{ github.repository }}-frontend

jobs:
  # ==========================================
  # JOB 1: Java Spring Boot Backend Validation
  # ==========================================
  validate-backend:
    name: Test & Build Java Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permissions for Maven Wrapper
        run: chmod +x mvnw

      - name: Run JUnit Tests & Static Verification
        run: ./mvnw test -B

      - name: Package Production JAR
        run: ./mvnw package -DskipTests -B

      - name: Upload Backend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ==========================================
  # JOB 2: React TypeScript Frontend Validation
  # ==========================================
  validate-frontend:
    name: Test & Build React Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Typecheck & Build Production Bundle
        run: npm run build

      - name: Upload Frontend Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ==========================================
  # JOB 3: Multi-Container Docker Registry Publish
  # ==========================================
  publish-containers:
    name: Build & Push Container Images (GHCR)
    needs: [validate-backend, validate-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for Backend Container
      - name: Extract Backend Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      # Build & Push Backend Container
      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Extract metadata for Frontend Container
      - name: Extract Frontend Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      # Build & Push Frontend Container
      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 4: Deployment Status Summary
  # ==========================================
  deployment-summary:
    name: Deployment Summary
    needs: [publish-containers]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Generate Deployment Report
        run: |
          echo "### 🚀 Automated Deployment Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Target Registry |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Java Spring Boot Backend** | ✅ Verified & Built | \`${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND_NAME }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **React Vite Frontend** | ✅ Verified & Built | \`${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND_NAME }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **pgvector PostgreSQL Stack** | ✅ Production Configured | \`docker-compose.yml\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run \`docker compose up -d\` on any server to launch the entire stack." >> $GITHUB_STEP_SUMMARY
